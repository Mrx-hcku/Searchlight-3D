name: Build Searchlight 3D APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Godot Android Game
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Godot 4.3 Engine
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip Godot_v4.3-stable_linux.x86_64.zip
        mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure 64-bit Only Export
      run: |
        python3 -c '
        import configparser
        config = configparser.ConfigParser()
        config.read("export_presets.cfg")
        for section in config.sections():
            if config.has_option(section, "platform") and config.get(section, "platform") == "Android":
                config.set(section, "architectures/armv7", "false")
                config.set(section, "architectures/arm64", "true")
                config.set(section, "architectures/x86", "false")
                config.set(section, "architectures/x86_64", "false")
        with open("export_presets.cfg", "w") as configfile:
            config.write(configfile)
        '

    - name: Export Android APK
      run: |
        mkdir -p build/android
        godot --headless --export-release "Android" build/android/Searchlight3D.apk

    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Searchlight3D-APK
        path: build/android/Searchlight3D.apk
