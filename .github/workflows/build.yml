name: Build Searchlight 3D APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Godot Android Game
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 1. Caching Godot Binaries & Export Templates to speed up future runs
    - name: Cache Godot & Export Templates
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/bin/godot
          ~/.local/share/godot/export_templates/
        key: godot-4.3-stable-templates

    - name: Download Godot 4.3 Engine and Export Templates
      if: steps.cache-godot.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip -q Godot_v4.3-stable_linux.x86_64.zip
        sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
        rm Godot_v4.3-stable_linux.x86_64.zip
        
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
        unzip -q Godot_v4.3-stable_export_templates.tpz
        mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
        rm Godot_v4.3-stable_export_templates.tpz

    # 2. Caching Android SDK components
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/android-sdk/cmdline-tools
          ~/android-sdk/platforms
          ~/android-sdk/build-tools
          ~/android-sdk/platform-tools
        key: ${{ runner.os }}-android-sdk-34

    - name: Set up Android SDK Manually
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true
          rm -rf cmdline-tools.zip cmdline-tools
        fi
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    # 3. Generate automatic Debug Keystore for smooth APK signing
    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    # 4. Auto-configure export_presets.cfg (arm64-v8a only for smaller size & keystore paths)
    - name: Ensure arm64-only & SDK configuration
      run: |
        python3 -c '
        import configparser, os

        config_path = "export_presets.cfg"
        if os.path.exists(config_path):
            config = configparser.ConfigParser()
            config.read(config_path)
            
            keystore_path = os.path.expanduser("~/.android/debug.keystore")
            android_sdk_path = os.path.expanduser("~/android-sdk")

            for section in config.sections():
                if config.has_option(section, "platform") and config.get(section, "platform") == "Android":
                    config.set(section, "architectures/armv7", "false")
                    config.set(section, "architectures/arm64", "true")
                    config.set(section, "architectures/x86", "false")
                    config.set(section, "architectures/x86_64", "false")
                    
                    config.set(section, "keystore/debug", keystore_path)
                    config.set(section, "keystore/debug_user", "androiddebugkey")
                    config.set(section, "keystore/debug_password", "android")
                    config.set(section, "sdk/android_sdk_path", android_sdk_path)
            
            with open(config_path, "w") as f:
                config.write(f)
            print("Successfully updated export_presets.cfg with 64-bit and keystore settings.")
        else:
            print("export_presets.cfg not found, skipping patch step.")
        '

    - name: Export Android APK (arm64 only)
      run: |
        mkdir -p build/android
        godot --verbose --headless --export-release "Android" build/android/Searchlight3D.apk

    # 5. Print clean error summary if Godot build fails
    - name: Print error summary on failure
      if: failure()
      run: |
        echo "===== BUILD ERROR LOGS ====="
        echo "Check export_presets.cfg settings, SDK paths, or Godot project configuration."

    - name: Upload APK to GitHub Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Searchlight3D-APK
        path: build/android/Searchlight3D.apk
        retention-days: 7
