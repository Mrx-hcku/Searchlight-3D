name: Build Searchlight 3D APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Godot Android Game
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Godot 4.3 Engine and Export Templates
      run: |
        # 1. Download Godot Editor
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
        unzip Godot_v4.3-stable_linux.x86_64.zip
        mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
        
        # 2. Download and Extract Android Export Templates
        wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
        unzip Godot_v4.3-stable_export_templates.tpz
        mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure 64-bit Only Export (Reduce APK Size)
      run: |
        python3 -c '
        import configparser
        config = configparser.ConfigParser()
        config.read("export_presets.cfg")
        for section in config.sections():
            if config.has_option(section, "platform") and config.get(section, "platform") == "Android":
                config.set(section, "architectures/armv7", "false")
                config.set(section, "architectures/arm64", "true")
                config.set(section, "architectures/x86", "false")
                config.set(section, "architectures/x86_64", "false")
        with open("export_presets.cfg", "w") as configfile:
            config.write(configfile)
        '

    - name: Export Android APK (arm64 only)
      run: |
        mkdir -p build/android
        godot --headless --export-release "Android" build/android/Searchlight3D.apk

    - name: Upload APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Searchlight3D-APK
        path: build/android/Searchlight3D.apk
